<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관리자 로그인 | IUX ART</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/admin.css">
<style>
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:24px 16px}
  .lg{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:var(--shadow)}
  .lg-logo{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0 0 4px;color:var(--ink)}
  .lg-sub{color:var(--ink-3);font-size:14px;margin:0 0 24px}
  .lg label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
  .lg input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:10px;padding:0 14px;font:inherit;font-size:15px;background:var(--panel);color:var(--ink);margin:0 0 16px}
  .lg input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .lg button{width:100%;height:48px;border:0;border-radius:var(--pill);background:var(--brand);color:var(--on-brand);font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}
  .lg button:disabled{opacity:.6}
  .lg-err{color:var(--bad);font-size:13px;min-height:20px;margin:10px 0 0;text-align:center}
  .lg-foot{text-align:center;font-size:13px;color:var(--ink-3);margin:18px 0 0}
  .lg-foot a{color:var(--ink-2)}
</style>
</head>
<body>
<form class="lg" id="f" novalidate>
  <p class="lg-logo">IUX ART</p>
  <p class="lg-sub">운영 관리자 로그인</p>
  <label for="id">이메일</label>
  <input id="id" type="email" required autocomplete="username" autofocus>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" required autocomplete="current-password">
  <button type="submit">로그인</button>
  <p class="lg-err" id="err" role="alert"></p>
  <p class="lg-foot"><a id="studioLink" href="https://studio.iux.kr/admin/#/site/iux-art/app">studio 계정으로 들어가기</a> · <a href="/reset.html">비밀번호 찾기</a> · <a href="/">홈페이지</a></p>
</form>
<script src="/js/iux-config.js"></script>
<script>
(function () {
  var C = (window.IUX_CONFIG || {}).studio; if (C) document.getElementById('studioLink').href = C.admin + '#/site/' + C.siteId + '/app';
  var f = document.getElementById('f'), err = document.getElementById('err');
  var next = (location.search.match(/[?&]next=([^&]+)/) || [])[1];
  next = next ? decodeURIComponent(next) : '';
  if (!/^\/admin\//.test(next) || /login/.test(next)) next = '/admin/index.html';
  f.onsubmit = function (e) {
    e.preventDefault(); err.textContent = '';
    if (!f.checkValidity()) { f.reportValidity(); return; }
    var b = f.querySelector('button'); b.disabled = true;
    fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: document.getElementById('id').value.trim(), password: document.getElementById('pw').value, role: 'admin' }) })
      .then(function (r) { return r.json().then(function (o) { if (!r.ok) throw new Error(o.error || '로그인하지 못했어요.'); location.href = next; }); })
      .catch(function (x) { err.textContent = x.message || '로그인하지 못했어요.'; })
      .then(function () { b.disabled = false; });
  };
})();
</script>
</body>
</html>
